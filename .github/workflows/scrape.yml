name: Scrape events

on:
  schedule:
    - cron: '0 5 * * *'    # 08:00 Helsinki (UTC+3 summer / UTC+2 winter)
    - cron: '0 9 * * *'    # 12:00 Helsinki
    - cron: '0 12 * * *'   # 15:00 Helsinki
    - cron: '0 15 * * *'   # 18:00 Helsinki
    - cron: '0 18 * * *'   # 21:00 Helsinki
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python3 scrape-events.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrape-events.js
          git diff --cached --quiet || git commit -m "chore: update scraped events"
          git pull --rebase origin main
          git push
